[project]
name = "arena_harness"
version = "0.0.0"
description = "Extraction metrics, gold storage format and report generator."
requires-python = ">=3.12,<3.13"
dependencies = ["pydantic>=2", "pyyaml>=6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/arena_harness"]
