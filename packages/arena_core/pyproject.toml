[project]
name = "arena_core"
version = "0.0.0"
description = "Config, database, seed loader, provenance and event log."
requires-python = ">=3.12,<3.13"
dependencies = ["sqlalchemy>=2", "alembic>=1.13", "psycopg[binary]>=3.2", "pgvector>=0.3", "pydantic>=2", "pydantic-settings>=2"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/arena_core"]
