[project]
name = "arena_ingest"
version = "0.0.0"
description = "Discovery crawl, entity resolution, episode selection, transcript fetch, ASR."
requires-python = ">=3.12,<3.13"
dependencies = [
    "arena_core",
    "trafilatura>=2.3.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/arena_ingest"]

[tool.uv.sources]
arena_core = { workspace = true }
