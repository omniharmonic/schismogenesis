[project]
name = "dialogos-arena"
version = "0.0.0"
description = "Dialogos Arena: Benjamin Life (@omniharmonic)"
requires-python = ">=3.12,<3.13"
dependencies = ["arena_cli"]

[tool.uv]
package = false

[tool.uv.sources]
arena_cli = { workspace = true }

[tool.uv.workspace]
members = ["packages/*", "services/*", "scripts", "evals/harness"]

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6", "pyright>=1.1.380", "hypothesis>=3", "numpy>=2"]

[tool.ruff]
line-length = 100
target-version = "py312"
exclude = ["docs/", "seed/scripts/"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["B008"] # typer declares options as argument defaults

[tool.pyright]
include = ["packages", "services", "scripts", "evals/harness"]
exclude = ["**/.venv", "**/__pycache__"]
pythonVersion = "3.12"
typeCheckingMode = "standard"
extraPaths = ["packages/arena_core/tests"]

[tool.pytest.ini_options]
testpaths = ["packages", "evals/harness/tests", "scripts/tests"]
addopts = "--import-mode=importlib -ra"
pythonpath = ["packages/arena_core/tests"]
markers = ["db: needs a Postgres + pgvector server"]
