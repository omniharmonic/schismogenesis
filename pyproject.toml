[project]
name = "dialogos-arena"
version = "0.0.0"
description = "Dialogos Arena: Benjamin Life (@omniharmonic)"
requires-python = ">=3.12,<3.13"
dependencies = ["arena_cli"]

[tool.uv]
package = false

[tool.uv.sources]
arena_cli = { workspace = true }

[tool.uv.workspace]
members = ["packages/*", "services/*", "scripts", "evals/harness"]

[dependency-groups]
dev = [
    "pytest>=8",
 "ruff>=0.6",
 "pyright>=1.1.380",
 "hypothesis>=3",
 "numpy>=2",
 "httpx2>=2.16.0",
]

[tool.ruff]
line-length = 100
target-version = "py312"
exclude = ["docs/", "seed/scripts/"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["B008"] # typer declares options as argument defaults

[tool.ruff.lint.per-file-ignores]
# SQL text reads better unwrapped
"services/api/src/arena_api/store.py" = ["E501"]

[tool.pyright]
include = ["packages", "services", "scripts", "evals/harness"]
exclude = [
    "**/.venv", "**/__pycache__",
    # Local-model scripts need the optional nli extra, which CI does not install.
    "scripts/build_atlas.py", "scripts/densify_structure.py", "scripts/merge_structure.py",
    "scripts/prepare_structure.py",
]
pythonVersion = "3.12"
typeCheckingMode = "standard"
extraPaths = ["packages/arena_core/tests"]

[tool.pytest.ini_options]
testpaths = ["packages", "services/api/tests", "evals/harness/tests", "scripts/tests"]
addopts = "--import-mode=importlib -ra"
pythonpath = ["packages/arena_core/tests"]
markers = ["db: needs a Postgres + pgvector server"]
