[project]
name = "arena_cli"
version = "0.0.0"
description = "The arena command-line tool."
requires-python = ">=3.12,<3.13"
dependencies = ["typer>=0.12", "rich>=13", "arena_core", "arena_harness"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/arena_cli"]

[project.scripts]
arena = "arena_cli.main:app"

[tool.uv.sources]
arena_core = { workspace = true }
arena_harness = { workspace = true }
