@font-face { font-family: "Plex Cond"; src: url("fonts/IBMPlexSansCondensed-Regular.woff2") format("woff2"); font-weight: 400; font-display: swap; }

:root{
  color-scheme:dark;
  --ground:#121820; --ground-2:#19212b; --panel:rgba(17,23,31,.86); --panel-solid:#161d26;
  --rule:#2b3644; --rule-2:#3a4757; --ink:#dde4eb; --ink-2:#9aa7b6; --ink-3:#6f7c8c;

  --l-ontological:#d0663a; --l-epistemic:#d9a33c; --l-axiological:#8fb65c; --l-empirical:#46b5ad; --l-praxis:#a9c1ff;
  --accept:#43c3a3; --reject:#f06a9b;
  --f-serif:"Newsreader","Iowan Old Style",Georgia,serif;
  --f-ui:"Plex Cond","Arial Narrow","Roboto Condensed",sans-serif;

  --top-h:56px; --panel-w:430px;
}
*,*::before,*::after{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--ground);color:var(--ink);font:400 16px/1.5 var(--f-serif);overflow:hidden}
a{color:var(--recog);text-underline-offset:3px;text-decoration-thickness:1px}

button,input,select{font:inherit;color:inherit}

:focus-visible{outline:2px solid var(--recog);outline-offset:2px;border-radius:2px}
.skip{position:absolute;left:12px;top:-60px;z-index:100;background:var(--recog);color:var(--ground);padding:8px 12px;font:600 15px var(--f-ui)}
.skip:focus{top:12px}

/* ---------- shared top bar ---------- */
.top{position:fixed;z-index:20;top:0;left:0;right:0;height:var(--top-h);display:flex;align-items:center;gap:18px;
  padding:0 max(18px,env(safe-area-inset-right,0px)) 0 max(18px,env(safe-area-inset-left,0px));
  background:linear-gradient(to bottom,rgba(18,24,32,.96),rgba(18,24,32,.8));border-bottom:1px solid var(--rule);
  -webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px)}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.mark{display:inline-flex;align-items:baseline;text-decoration:none;color:var(--ink);font:400 24px/1 var(--f-macro);letter-spacing:.01em}
.mark:hover{color:var(--ink)}
.mark-x{display:inline-block;width:13px;height:13px;margin:0 3px;position:relative;align-self:center}
.mark-x::before,.mark-x::after{content:"";position:absolute}
.mark-x::before{left:0;right:0;top:5.5px;height:2px;background:var(--heat)}
.mark-x::after{top:0;bottom:0;left:5.5px;width:2px;background:var(--recog)}
.mark:hover .mark-a,.mark:hover .mark-b{text-shadow:2px 0 var(--heat),-2px 0 var(--recog)}
.slash{color:var(--ink-3);font:400 20px var(--f-ui)}
.sub-brand{font:600 16px/1 var(--f-ui);color:var(--ink);text-decoration:none;white-space:nowrap}

.top-nav{display:flex;gap:20px;margin-left:auto}

.top-nav a:hover,.top-nav a[aria-current]{color:var(--ink)}
.top-nav a[aria-current]{box-shadow:inset 0 -1px 0 var(--recog)}

/* ---------- stage + HUD ---------- */
#stage{position:fixed;top:var(--top-h);right:0;bottom:0;left:var(--panel-w)}

.hud{position:fixed;top:var(--top-h);right:0;bottom:0;left:var(--panel-w);pointer-events:none;z-index:3;overflow:hidden}
.hud-corner{position:absolute;width:18px;height:18px;border:0 solid var(--rule-2)}
.hud-corner.tl{left:10px;top:10px;border-left-width:1px;border-top-width:1px}
.hud-corner.tr{right:10px;top:10px;border-right-width:1px;border-top-width:1px}
.hud-corner.bl{left:10px;bottom:10px;border-left-width:1px;border-bottom-width:1px}
.hud-corner.br{right:10px;bottom:10px;border-right-width:1px;border-bottom-width:1px}
.xh{position:absolute;background:rgba(143,176,255,.16);display:none}

.hud.aim .xh{display:block}

<script>
const A = JSON.parse(document.getElementById('data').textContent);
/* faces, roles and top positions for each person, from the debate's bundle (see build_page.py) */
let CARDS = {}; try { CARDS = JSON.parse(document.getElementById('cards').textContent) || {}; } catch { CARDS = {}; }
const LAYERS = ['praxis','empirical','axiological','epistemic','ontological'];
const NAME = {praxis:'Action',empirical:'World',axiological:'Values',epistemic:'Knowing',ontological:'Being'};
const ASKS = {praxis:'What should be done?',empirical:'How is the world, and where is it going?',axiological:'What matters?',epistemic:'How do we know?',ontological:'What exists?'};
const css = n => getComputedStyle(document.documentElement).getPropertyValue(n).trim();
const COLOR = Object.fromEntries(LAYERS.map(l => [l, css('--l-'+l)]));
const HEIGHT = {ontological:-120,epistemic:-60,axiological:0,empirical:60,praxis:120};
const SURFACE = 190;
/* the four camp colours, in camp order (c1..c4), and grey for anyone not in a camp */
const CAMP = [css('--c1'), css('--c2'), css('--c3'), css('--c4')];
const UNGROUPED = css('--c0');
const RECOG = css('--recog');
const REDUCE = matchMedia('(prefers-reduced-motion: reduce)').matches;
const FINE = matchMedia('(pointer: fine)').matches;
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const person = Object.fromEntries(A.people.map(p => [p.id,p]));
const idea = Object.fromEntries(A.ideas.map(i => [i.id,i]));
const state = {tab:'start', person:null, second:null, idea:null, school:null, node:null, lens:null, family:null, hidden:new Set(), year:A.meta.last_year};
/* the drill-down tree: camps, schools inside them, then branches and close circles */
const TREE = {}; (function index(list, parent){ (list||[]).forEach(n => { TREE[n.id] = {...n, parent}; index(n.children, n.id); }); })(A.tree, null);
const LEVEL = ['Camp','School','Branch','Close circle'];
const lineage = id => { const out = []; for (let n = TREE[id]; n; n = TREE[n.parent]) out.unshift(n); return out; };
const everyone = n => [...n.members, ...(n.attached||[])];
const ROOTS = (A.tree || []).map(n => n.id);
const groupColor = id => { const r = lineage(id)[0]; const i = r ? ROOTS.indexOf(r.id) : -1; return i >= 0 ? CAMP[i % CAMP.length] : UNGROUPED; };
const campOf = id => { const r = (person[id]?.path || []).find(x => TREE[x]); return r ? lineage(r)[0] : null; };
const campColor = id => { const c = campOf(id); return c ? groupColor(c.id) : UNGROUPED; };
const schoolColor = s => campColor(s?.members?.[0]);
const initialsOf = id => CARDS[id]?.initials || (person[id]?.name || '?').split(/\s+/).filter(w => /^[A-Z]/.test(w)).map(w => w[0]).slice(0, 2).join('');
const shortName = n => n.replace(' (Beff Jezos)','');
const isMobile = () => innerWidth <= 760;
const stageEl = document.getElementById('stage');
const stageSize = () => { const r = stageEl.getBoundingClientRect(); return [Math.max(1, r.width), Math.max(1, r.height)]; };
/* a small face for chips and the hover card: the portrait, or initials, ringed in camp colour */
function face(id, size){
  const c = CARDS[id] || {};
  return `<span class="face" aria-hidden="true" style="--sw:${campColor(id)};${size ? `width:${size}px;height:${size}px;border-width:2px;font-size:${Math.round(size*.3)}px;` : ''}${c.face ? `background-image:url('${esc(c.face)}')` : ''}">${c.face ? '' : esc(initialsOf(id))}</span>`;
}
const personChip = (id, label, attr = 'data-person') => person[id] ? `<button class="chip" ${attr}="${esc(id)}">${face(id)}${esc(label ?? person[id].name)}</button>` : '';

/* ---------- graph data ---------- */
/* a small, fixed jitter so the graph visibly gathers and settles when it opens */
const jit = (s, k) => { let h = 2166136261; for (const ch of s + k) h = Math.imul(h ^ ch.charCodeAt(0), 16777619); return ((h >>> 0) / 4294967296 - .5) * 2; };
const spread = REDUCE ? 0 : 1;
const nodes = [
  ...A.ideas.map(i => ({id:i.id, kind:'idea', fy:HEIGHT[i.layer], ax:i.x, az:i.y, x:i.x + jit(i.id,'x')*30*spread, z:i.y + jit(i.id,'z')*30*spread, y:HEIGHT[i.layer], d:i})),
  ...A.people.map(p => ({id:p.id, kind:'person', ax:p.x, az:p.y, x:p.x*(1 - .35*spread) + jit(p.id,'x')*50*spread, z:p.y*(1 - .35*spread) + jit(p.id,'z')*50*spread, y:SURFACE + jit(p.id,'y')*60*spread, d:p})),
];
const known = new Set(nodes.map(n => n.id));
/* a link to someone not on the map would stop the whole layout, so drop it */
const argLinks = A.links.filter(l => known.has(l.s) && known.has(l.t)).map(l => ({source:l.s, target:l.t, kind:'arg', d:l}));
const holdLinks = A.ideas.flatMap(i => i.holders.filter(h => known.has(h.p)).map(h => ({source:h.p, target:i.id, kind:'hold', d:h})));
/* kin: each person to the people whose published words sit closest to theirs */
const kinSeen = new Set();
const kinLinks = A.people.flatMap(p => (p.nearest || []).filter(q => known.has(q) && q !== p.id).flatMap(q => {
  const k = pairKey(p.id, q); if (kinSeen.has(k)) return []; kinSeen.add(k);
  return [{source:p.id, target:q, kind:'kin', d:{}}];
}));
function pairKey(a,b){ return [a,b].sort().join('|'); }
const LINK = {supports:'#43c3a3',rebuts:'#f06a9b',undercuts:'#f06a9b',undermines:'#f06a9b',qualifies:'#d9a33c',presupposes:'#8fb0ff',exemplifies:'#9aa7b6',defines:'#9aa7b6'};
const graphData = {nodes, links:[...kinLinks, ...argLinks, ...holdLinks]};
const nodeById = Object.fromEntries(nodes.map(n => [n.id,n]));

/* ---------- selection logic ---------- */
function focusSet(){
  if (state.lens!==null){ const l = A.lenses[state.lens]; return new Set([...l.shared,...l.opposed,...l.a,...l.b]); }
  if (state.family!==null) return new Set(A.families.find(f => f.id===state.family).ideas);
  if (state.person && state.second){
    const f = A.forks[pairKey(state.person,state.second)] || {shared:[],opposed:[]};
    return new Set([...f.shared,...f.opposed,state.person,state.second]);
  }
  if (state.person) return new Set([state.person, ...A.ideas.filter(i => i.holders.some(h => h.p===state.person)).map(i => i.id)]);
  if (state.idea){
    const near = A.links.flatMap(l => l.s===state.idea?[l.t]:l.t===state.idea?[l.s]:[]);
    return new Set([state.idea, ...near, ...idea[state.idea].holders.map(h => h.p)]);
  }
  if (state.node){
    const m = everyone(TREE[state.node]);
    return new Set([...m, ...A.ideas.filter(i => i.holders.some(h => m.includes(h.p))).map(i => i.id)]);
  }
  if (state.school){
    const s = A.schools[state.school];
    return new Set([...s.members, ...A.ideas.filter(i => i.holders.some(h => s.members.includes(h.p))).map(i => i.id)]);
  }
  return null;
}
let FOCUS = null;   // focusSet(), worked out once per render
function linkShown(l){
  const a = l.source.id ?? l.source, b = l.target.id ?? l.target;
  if (hiddenNode(nodeById[a]) || hiddenNode(nodeById[b])) return false;
  if (l.kind==='kin') return true;
  if (l.kind==='hold') return (state.person && a===state.person) || (state.second && a===state.second) || (state.idea && b===state.idea);
  const f = FOCUS;
  return !!f && f.has(a) && f.has(b) && !state.school && state.family===null;
}
function linkColorOf(l){
  if (l.kind==='kin'){
    const a = l.source.id ?? l.source, b = l.target.id ?? l.target;
    if (!FOCUS) return 'rgba(221,228,235,0.17)';
    return FOCUS.has(a) && FOCUS.has(b) ? 'rgba(143,176,255,0.55)' : 'rgba(221,228,235,0.05)';
  }
  if (l.kind==='hold') return l.d.a>0 ? 'rgba(67,195,163,0.38)' : 'rgba(240,106,155,0.42)';
  return hexA(LINK[l.d.type]||'#9aa7b6', .42);
}
const hexA = (h, a) => `rgba(${parseInt(h.slice(1,3),16)},${parseInt(h.slice(3,5),16)},${parseInt(h.slice(5,7),16)},${a})`;
function hiddenNode(n){
  if (!n) return true;
  if (n.kind==='person') return false;
  return state.hidden.has(n.d.layer) || (n.d.year && n.d.year > state.year);
}
function nodeColorOf(n){
  const f = FOCUS;
  if (n.kind==='person') return campColor(n.id);
  if (state.lens!==null){
    const l = A.lenses[state.lens];
    if (l.opposed.includes(n.id)) return css('--reject');
    if (l.shared.includes(n.id)) return css('--accept');
  }
  if (state.person && state.second){
    const fork = A.forks[pairKey(state.person,state.second)];
    if (fork?.opposed.includes(n.id)) return css('--reject');
    if (fork?.shared.includes(n.id)) return css('--accept');
  }
  const base = COLOR[n.d.layer];
  return !f || f.has(n.id) ? base : '#3a4757';
}

/* ---------- faces as sprites ----------
   Each person is a round portrait ringed in their camp colour: grey at rest, as on the lab's map,
   in colour when they are hovered or part of what is selected. Textures are drawn once and cached. */
const FACE_PX = 128, FACE_SIZE = 15;
const TEX = new Map();      // id -> {gray, color}
const IMG = new Map();      // id -> loaded HTMLImageElement
function drawFace(id, gray){
  const cv = document.createElement('canvas'); cv.width = cv.height = FACE_PX;
  const c = cv.getContext('2d'), R = FACE_PX/2, img = IMG.get(id);
  c.save(); c.beginPath(); c.arc(R, R, R-5, 0, Math.PI*2); c.clip();
  if (img){
    const s = Math.max(FACE_PX/img.naturalWidth, FACE_PX/img.naturalHeight), w = img.naturalWidth*s, h = img.naturalHeight*s;
    c.drawImage(img, (FACE_PX-w)/2, (FACE_PX-h)*.2, w, h);
    if (gray){
      const px = c.getImageData(0, 0, FACE_PX, FACE_PX), d = px.data;
      for (let i = 0; i < d.length; i += 4){ const y = (d[i]*.3 + d[i+1]*.59 + d[i+2]*.11)*.86 + 6; d[i] = d[i+1] = d[i+2] = y; }
      c.putImageData(px, 0, 0);
    }
  } else {
    c.fillStyle = '#19212b'; c.fillRect(0, 0, FACE_PX, FACE_PX);
    c.fillStyle = gray ? '#9aa7b6' : '#dde4eb'; c.font = '600 46px "Plex Cond", "Arial Narrow", sans-serif';
    c.textAlign = 'center'; c.textBaseline = 'middle'; c.fillText(initialsOf(id), R, R+2);
  }
  c.restore();
  c.lineWidth = 8; c.strokeStyle = campColor(id); c.beginPath(); c.arc(R, R, R-5, 0, Math.PI*2); c.stroke();
  const t = new THREE.CanvasTexture(cv); t.anisotropy = 4; return t;
}
function faceTex(id){
  let t = TEX.get(id);
  if (!t){ t = {gray:drawFace(id, true), color:drawFace(id, false)}; TEX.set(id, t); }
  return t;
}
function redrawFace(id){
  const old = TEX.get(id); TEX.delete(id);
  const t = faceTex(id), n = nodeById[id];
  if (n?.__sprite){ n.__sprite.material.map = n.__lit ? t.color : t.gray; n.__sprite.material.needsUpdate = true; }
  if (old){ old.gray.dispose(); old.color.dispose(); }
}
function loadFaces(){
  A.people.forEach(p => {
    const src = CARDS[p.id]?.face; if (!src) return;
    const img = new Image(); img.decoding = 'async';
    img.onload = () => { IMG.set(p.id, img); redrawFace(p.id); };
    img.src = src;
  });
}
function personObject(n){
  const sp = new THREE.Sprite(new THREE.SpriteMaterial({map:faceTex(n.id).gray, transparent:true, depthWrite:false}));
  sp.scale.set(FACE_SIZE, FACE_SIZE, 1); sp.renderOrder = 2;
  n.__sprite = sp; n.__lit = false;
  return sp;
}
/* ideas are small and quiet so the people lead */
const GEO = new Map();
function ideaObject(n){
  const r = Math.round((1.5 + Math.sqrt(n.d.holders.length)*.85)*2)/2;
  if (!GEO.has(r)) GEO.set(r, new THREE.SphereGeometry(r, 10, 8));
  return new THREE.Mesh(GEO.get(r), new THREE.MeshBasicMaterial({color:nodeColorOf(n), wireframe:!!n.d.inferred, transparent:true, opacity:.5, depthWrite:false}));
}
function labelSprite(text, color, size=30, weight=500){
  const cv = document.createElement('canvas'), ctx = cv.getContext('2d');
  const font = `${weight} ${size*2}px "Plex Cond", "Arial Narrow", sans-serif`;
  ctx.font = font; const w = Math.ceil(ctx.measureText(text).width)+16, h = size*3;
  cv.width = w; cv.height = h; ctx.font = font; ctx.textBaseline = 'middle';
  ctx.fillStyle = color; ctx.fillText(text,8,h/2);
  const tex = new THREE.CanvasTexture(cv);
  const sp = new THREE.Sprite(new THREE.SpriteMaterial({map:tex,transparent:true,depthWrite:false}));
  sp.scale.set(w/6,h/6,1); return sp;
}
let hover = null;
const CAMP_TAGS = [];
function refreshColors(links = true){
  const f = FOCUS;
  let shown = 0;
  nodes.forEach(n => {
    const o = n.__threeObj; if (!o) return;
    const hide = hiddenNode(n);
    o.visible = !hide; if (!hide) shown++;
    if (n.kind==='idea'){
      o.material.color.set(nodeColorOf(n));
      o.material.opacity = (n === hover ? 1 : !f ? .5 : f.has(n.id) ? .9 : .06);
    } else {
      const on = !f || f.has(n.id);
      const lit = n === hover || (!!f && f.has(n.id));
      const t = faceTex(n.id);
      if (n.__lit !== lit){ n.__sprite.material.map = lit ? t.color : t.gray; n.__lit = lit; }
      n.__sprite.material.opacity = on ? 1 : .22;
      const big = n === hover || n.id === state.person || n.id === state.second ? 1.35 : 1;
      n.__sprite.scale.set(FACE_SIZE*big, FACE_SIZE*big, 1);
    }
  });
  if (links){ G.linkVisibility(linkShown).linkColor(linkColorOf); CAMP_TAGS.forEach(t => { t.material.opacity = f ? .28 : .9; }); }
  document.getElementById('ro-nodes').textContent = `${shown} of ${nodes.length}`;
}

/* ---------- 3D scene ---------- */
let G = null;
function hasWebGL(){
  try { const c = document.createElement('canvas'); return !!(c.getContext('webgl2')||c.getContext('webgl')); } catch { return false; }
}
function start3D(){
  const [w, h] = stageSize();
  G = ForceGraph3D({controlType:'orbit'})(stageEl)
    .backgroundColor(css('--ground'))
    .width(w).height(h)
    .showNavInfo(false)
    .graphData(graphData)
    .nodeId('id')
    .nodeLabel(() => '')
    .nodeThreeObject(n => n.kind==='person' ? personObject(n) : ideaObject(n))
    .linkVisibility(linkShown)
    .linkColor(linkColorOf)
    .linkOpacity(1)
    .linkWidth(0)
    .linkDirectionalArrowLength(l => l.kind==='arg' ? 2.6 : 0)
    .linkDirectionalArrowRelPos(.92)
    .linkDirectionalArrowColor(l => LINK[l.d.type] || '#9aa7b6')
    .enableNodeDrag(FINE)
    .d3AlphaDecay(REDUCE ? .05 : .016)
    .d3VelocityDecay(.32)
    .warmupTicks(REDUCE ? 420 : 30).cooldownTicks(REDUCE ? 0 : Infinity).cooldownTime(REDUCE ? 0 : 14000)
    .onNodeHover(n => setHover(n))
    .onNodeClick((n, e) => { lastNodeClick = performance.now(); if ((e?.pointerType === 'touch' || !FINE) && !isMobile()) showCard(n, true); n.kind==='person' ? pickPerson(n.id) : pickIdea(n.id); })
    .onNodeDragEnd(() => G.d3ReheatSimulation())
    .onBackgroundClick(() => { hideCard(); clearPick(); });

  /* gravity: each face is held by a soft spring to its place on the map, pulled toward its camp,
     tied to its nearest kin by hairlines, and kept from overlapping. Dragging one tugs its kin;
     let go and it drifts back. */
  const camps = {};
  A.people.forEach(p => { const c = campOf(p.id); if (!c) return; (camps[c.id] ||= {x:0, z:0, n:0}); camps[c.id].x += p.x; camps[c.id].z += p.y; camps[c.id].n++; });
  Object.values(camps).forEach(c => { c.x /= c.n; c.z /= c.n; });
  const people = nodes.filter(n => n.kind==='person');
  people.forEach(n => { const c = campOf(n.id); n.camp = c ? camps[c.id] : null; });
  G.d3Force('anchor', alpha => {
    nodes.forEach(n => {
      const k = n.kind==='person' ? .07 : .14;
      n.vx += (n.ax-n.x)*k*alpha; n.vz += (n.az-n.z)*k*alpha;
      if (n.kind==='person'){
        n.vy += (SURFACE-n.y)*.05*alpha;
        if (n.camp){ n.vx += (n.camp.x-n.x)*.018*alpha; n.vz += (n.camp.z-n.z)*.018*alpha; }
      }
    });
  });
  G.d3Force('collide', alpha => {
    const min = FACE_SIZE*1.12;
    for (let i = 0; i < people.length; i++) for (let j = i+1; j < people.length; j++){
      const a = people[i], b = people[j];
      const dx = b.x-a.x, dy = b.y-a.y, dz = b.z-a.z, d = Math.hypot(dx,dy,dz);
      if (d < min && d > .01){ const f = (min-d)/d*.35; a.vx -= dx*f; a.vy -= dy*f; a.vz -= dz*f; b.vx += dx*f; b.vy += dy*f; b.vz += dz*f; }
    }
  });
  G.d3Force('charge').strength(n => n.kind==='person' ? -22 : -5).distanceMax(120);
  G.d3Force('link')
    .strength(l => l.kind==='kin' ? .16 : l.kind==='hold' ? 0 : (l.d.type==='supports' ? .1 : l.d.type==='presupposes' ? .06 : 0))
    .distance(l => l.kind==='kin' ? 34 : HEIGHT_GAP(l));
  G.d3Force('rebut', alpha => {
    A.links.forEach(l => {
      if (!['rebuts','undercuts','undermines'].includes(l.type)) return;
      const a = nodeById[l.s], b = nodeById[l.t]; if (!a || !b) return;
      const dx = a.x-b.x, dz = a.z-b.z, d = Math.hypot(dx,dz)||1, f = alpha*.8/d;
      a.vx += dx*f; a.vz += dz*f; b.vx -= dx*f; b.vz -= dz*f;
    });
  });
  G.d3Force('center', null);
  window.__G = G;

  const scene = G.scene();
  scene.fog = new THREE.FogExp2(css('--ground'), REDUCE ? .0006 : .0009);
  const furnish = () => {
    LAYERS.forEach(l => {
      const grid = new THREE.GridHelper(420, 14, COLOR[l], '#3a4757');
      grid.position.y = HEIGHT[l]; grid.material.transparent = true; grid.material.opacity = .1; grid.material.depthWrite = false;
      scene.add(grid);
      const tag = labelSprite(NAME[l], COLOR[l], 20); tag.position.set(236,HEIGHT[l],0); tag.material.opacity = .8; scene.add(tag);
    });
    (A.tree || []).forEach((n, i) => {
      const pts = everyone(n).map(m => person[m]).filter(Boolean);
      if (pts.length < 2) return;
      const cx = pts.reduce((a,p) => a+p.x,0)/pts.length, cz = pts.reduce((a,p) => a+p.y,0)/pts.length;
      const r = Math.max(30, ...pts.map(p => Math.hypot(p.x-cx,p.y-cz)+12));
      const ring = new THREE.Mesh(new THREE.RingGeometry(r-.5,r,96), new THREE.MeshBasicMaterial({color:CAMP[i%CAMP.length],side:THREE.DoubleSide,transparent:true,opacity:.22,depthWrite:false}));
      ring.rotation.x = -Math.PI/2; ring.position.set(cx,SURFACE-14,cz); scene.add(ring);
      const tag = labelSprite(n.label, CAMP[i%CAMP.length], 30, 600); tag.position.set(cx,SURFACE+34,cz-r*.6); tag.material.opacity = FOCUS ? .28 : .9; scene.add(tag); CAMP_TAGS.push(tag);
    });
    // initials drawn before the font arrived get redrawn in Plex
    A.people.forEach(p => { if (!IMG.has(p.id) && TEX.has(p.id)) redrawFace(p.id); });
  };
  (document.fonts?.ready || Promise.resolve()).then(furnish);
  loadFaces();
  const [pos, at] = HOME(); G.cameraPosition(pos, at, 0);
  const controls = G.controls();
  if (controls){
    controls.enableDamping = !REDUCE; controls.dampingFactor = .08;
    controls.autoRotate = !REDUCE && !location.hash; controls.autoRotateSpeed = .35;
    const stop = () => { controls.autoRotate = false; };
    stageEl.addEventListener('pointerdown', stop); stageEl.addEventListener('wheel', stop, {passive:true});
    stageEl.addEventListener('touchstart', stop, {passive:true});
  }
  addEventListener('resize', () => { const [w2, h2] = stageSize(); G.width(w2).height(h2); });
  FOCUS = focusSet(); setTimeout(refreshColors, 80);
  requestAnimationFrame(hudLoop);
}
const HEIGHT_GAP = l => {
  const a = nodeById[l.source.id ?? l.source], b = nodeById[l.target.id ?? l.target];
  return Math.max(24, Math.abs((a.fy ?? SURFACE)-(b.fy ?? SURFACE)));
};

/* ---------- HUD: crosshair, readout, selection brackets ---------- */
const hud = document.getElementById('hud'), marks = document.getElementById('marks');
let pointer = {x:-1, y:-1, inside:false, type:'mouse'};
stageEl.addEventListener('pointermove', e => {
  pointer = {x:e.clientX, y:e.clientY, inside:true, type:e.pointerType};
  if (FINE && e.pointerType === 'mouse'){
    const r = hud.getBoundingClientRect();
    document.getElementById('xh-v').style.transform = `translateX(${e.clientX - r.left}px)`;
    document.getElementById('xh-h').style.transform = `translateY(${e.clientY - r.top}px)`;
    hud.classList.add('aim');
  }
  if (hover && card && !card.hidden && cardFor === hover) placeCard();
});
stageEl.addEventListener('pointerleave', () => { pointer.inside = false; hud.classList.remove('aim'); });
/* a first tap on a touch screen has no hover yet, so the graph may miss it: find the nearest face
   (or idea) under the finger ourselves, the way the lab's map does */
let lastNodeClick = 0, tapStart = null;
stageEl.addEventListener('pointerdown', e => { if (e.pointerType !== 'mouse') tapStart = {x:e.clientX, y:e.clientY, t:performance.now()}; });
stageEl.addEventListener('pointerup', e => {
  const s = tapStart; tapStart = null;
  if (!s || !G || Math.hypot(e.clientX - s.x, e.clientY - s.y) > 10 || performance.now() - s.t > 500) return;
  setTimeout(() => {
    if (performance.now() - lastNodeClick < 400) return;
    const r = stageEl.getBoundingClientRect(), x = e.clientX - r.left, y = e.clientY - r.top;
    let best = null, bd = 22*22;
    nodes.forEach(n => {
      if (!n.__threeObj?.visible || !Number.isFinite(n.x)) return;
      const p = G.graph2ScreenCoords(n.x, n.y, n.z), d = (p.x-x)**2 + (p.y-y)**2;
      if (d < bd * (n.kind === 'person' ? 1 : .4)) { bd = d; best = n; }
    });
    if (best){ lastNodeClick = performance.now(); best.kind === 'person' ? pickPerson(best.id) : pickIdea(best.id); }
  }, 60);
});
const markEls = [];
function markEl(i){
  if (!markEls[i]){
    const b = document.createElement('div'); b.className = 'brk'; b.innerHTML = '<i></i><i></i><i></i><i></i>';
    const t = document.createElement('div'); t.className = 'tag';
    marks.append(b, t); markEls[i] = {b, t};
  }
  return markEls[i];
}
let lastRo = 0;
function hudLoop(t){
  requestAnimationFrame(hudLoop);
  if (!G) return;
  const cam = G.camera(), r = stageEl.getBoundingClientRect();
  const want = [state.person, state.second].filter(Boolean).map(id => ({n:nodeById[id], tag:true}));
  if (hover && hover.kind === 'person' && !want.some(w => w.n === hover)) want.push({n:hover, tag:false});
  const pxPerUnit = d => r.height / (2*d*Math.tan(cam.fov*Math.PI/360));
  want.forEach((w, i) => {
    const m = markEl(i), n = w.n;
    if (!n || !Number.isFinite(n.x)){ m.b.style.display = m.t.style.display = 'none'; return; }
    const s = G.graph2ScreenCoords(n.x, n.y, n.z);
    const d = cam.position.distanceTo(new THREE.Vector3(n.x, n.y, n.z));
    const behind = new THREE.Vector3(n.x, n.y, n.z).project(cam).z > 1;
    if (behind || s.x < -40 || s.y < -40 || s.x > r.width+40 || s.y > r.height+40){ m.b.style.display = m.t.style.display = 'none'; return; }
    const half = Math.max(10, FACE_SIZE*.675*pxPerUnit(d)) + 6;
    m.b.style.display = ''; m.b.classList.toggle('soft', !w.tag);
    m.b.style.width = m.b.style.height = `${half*2}px`;
    m.b.style.transform = `translate(${Math.round(s.x-half)}px,${Math.round(s.y-half)}px)`;
    if (w.tag && !isMobile()){
      const p = person[n.id], c = campOf(n.id);
      m.t.style.display = ''; m.t.style.setProperty('--sw', campColor(n.id));
      m.t.innerHTML = `${esc(shortName(p.name))}<small>${esc(c ? c.label : 'Between camps')}</small>`;
      const tw = m.t.offsetWidth;
      const x = s.x + half + 8 + tw > r.width - 8 ? s.x - half - 8 - tw : s.x + half + 8;
      m.t.style.transform = `translate(${Math.round(x)}px,${Math.round(s.y - 18)}px)`;
    } else m.t.style.display = 'none';
  });
  for (let i = want.length; i < markEls.length; i++){ markEls[i].b.style.display = markEls[i].t.style.display = 'none'; }
  if (t - lastRo > 120){
    lastRo = t;
    const c = G.controls?.(), tg = c?.target || {x:0,y:0,z:0};
    const dx = cam.position.x - tg.x, dy = cam.position.y - tg.y, dz = cam.position.z - tg.z;
    const az = Math.atan2(dx, dz)*180/Math.PI, el = Math.atan2(dy, Math.hypot(dx, dz))*180/Math.PI;
    const f = v => (v < 0 ? '−' : '+') + Math.abs(v).toFixed(1).padStart(5, '0');
    document.getElementById('ro-cam').textContent = `${f(az)} ${f(el)}`;
  }
}

/* ---------- hover card ---------- */
let card = null, cardFor = null, showTimer = 0, hideTimer = 0;
function ensureCard(){
  if (card) return card;
  card = document.createElement('div'); card.className = 'hovercard'; card.id = 'atlas-hovercard'; card.setAttribute('role', 'tooltip'); card.hidden = true;
  card.addEventListener('pointerenter', () => clearTimeout(hideTimer));
  card.addEventListener('pointerleave', e => { if (e.pointerType !== 'touch') scheduleHide(); });
  document.body.append(card);
  addEventListener('keydown', e => { if (e.key === 'Escape' && !card.hidden) hideCard(); }, true);
  document.addEventListener('pointerdown', e => { if (!card.hidden && !card.contains(e.target) && !stageEl.contains(e.target)) hideCard(); }, true);
  addEventListener('resize', hideCard, {passive:true});
  return card;
}
function cardHTML(n){
  if (n.kind === 'idea'){
    const i = n.d;
    return `<p class="meta"><span class="layerdot ${i.inferred?'hollow':''}" style="background:${COLOR[i.layer]};border-color:${COLOR[i.layer]}"></span>${NAME[i.layer]} · ${i.holders.length} ${i.holders.length === 1 ? 'person' : 'people'}${i.inferred ? ' · inferred' : ''}</p>
      <p class="hc-idea">${esc(i.text)}</p><p class="hc-hint">Select to see who holds it and what it rests on.</p>`;
  }
  const p = person[n.id], c = CARDS[n.id] || {};

  const where = path.length
    ? `<dl class="hc-where"><div><dt>Camp</dt><dd>${esc(TREE[path[0]].label)}</dd></div>${path.length > 1 ? `<div><dt>School</dt><dd>${esc(TREE[path[1]].label)}</dd></div>` : ''}</dl>`
    : c.between ? `<p class="hc-where-line">Between the ${esc(c.between[0])} and the ${esc(c.between[1])}</p>` : `<p class="hc-where-line">Not yet grouped in a school</p>`;
  const rows = (c.positions || []);
  const positions = rows.length
    ? `<ul class="hc-positions">${rows.map(r => `<li><span class="hc-side ${r.side === 1 ? 'agree' : 'disagree'}">${r.side === 1 ? 'Agrees' : 'Disagrees'}</span><span class="hc-text">${esc(r.text)}</span></li>`).join('')}</ul>`
    : (c.voices || []).length ? `<ul class="hc-positions">${c.voices.map(v => `<li><span class="hc-text">${esc(v)}</span></li>`).join('')}</ul>` : '';
  return `<div class="hc-head">${face(n.id)}<div>
      <p class="hc-name">${esc(p.name)}</p>${role ? `<p class="hc-role">${esc(role)}</p>` : ''}${c.provisional ? `<p class="hc-role">A newer voice on the map</p>` : ''}
    </div></div>${where}${positions}
    <a class="hc-link" href="/people#${encodeURIComponent(n.id)}">See full profile <span aria-hidden="true">→</span></a>`;
}
function placeCard(){
  const w = card.offsetWidth, h = card.offsetHeight, vw = document.documentElement.clientWidth, vh = innerHeight;
  let x, y;
  if (pointer.inside || cardFor?.__at){
    const px = cardFor?.__at ? cardFor.__at.x : pointer.x, py = cardFor?.__at ? cardFor.__at.y : pointer.y;
    x = px + 18 + w <= vw - 8 ? px + 18 : px - 18 - w;
    y = py - h/2;
  } else { x = vw - w - 8; y = 8; }
  x = Math.max(8, Math.min(vw - w - 8, x)); y = Math.max(8, Math.min(vh - h - 8, y));
  card.style.transform = `translate(${Math.round(x)}px,${Math.round(y)}px)`;
}
function showCard(n, now = false){
  clearTimeout(showTimer); clearTimeout(hideTimer);
  const open = () => {
    ensureCard();
    if (cardFor === n && !card.hidden) return;
    cardFor = n;
    if (now && G){ const r = stageEl.getBoundingClientRect(), s = G.graph2ScreenCoords(n.x, n.y, n.z); n.__at = {x:r.left + s.x, y:r.top + s.y}; } else delete n.__at;
    card.style.setProperty('--sw', n.kind === 'person' ? campColor(n.id) : COLOR[n.d.layer]);
    card.innerHTML = cardHTML(n); card.style.maxHeight = ''; card.classList.remove('is-open'); card.hidden = false;
    if (isMobile() && now){ card.style.transform = `translate(8px,${Math.round(stageEl.getBoundingClientRect().top + 8)}px)`; }
    else placeCard();

}
function hideCard(){ clearTimeout(showTimer); clearTimeout(hideTimer); if (card){ card.hidden = true; card.classList.remove('is-open'); } if (cardFor) delete cardFor.__at; cardFor = null; }
function scheduleHide(){ clearTimeout(hideTimer); hideTimer = setTimeout(hideCard, 160); }
function setHover(n){
  if (n === hover) return;
  hover = n || null;
  stageEl.style.cursor = n ? (FINE ? 'grab' : 'pointer') : '';
  if (n && FINE && pointer.type !== 'touch') showCard(n); else if (!n && cardFor && !cardFor.__at) scheduleHide();
  document.getElementById('ro-view').textContent = n ? (n.kind === 'person' ? shortName(n.d.name) : NAME[n.d.layer] + ' idea') : title(snapshot());

/* ---------- picks and navigation ----------
   Every selection is a step in the browser's history, so Back (the button, Esc, or the browser's
   own) returns to exactly where you were, and each view has a link you can share. */
const KEYS = ['tab','person','second','idea','school','node','lens','family'];
const snapshot = () => Object.fromEntries(KEYS.map(k => [k, state[k]]));
function resetPicks(){ state.person = state.second = state.idea = state.school = state.node = state.lens = state.family = null; }
function title(v){
  if (v.person && v.second) return `${person[v.person]?.name} and ${person[v.second]?.name}`;
  if (v.person) return person[v.person]?.name || 'a person';
  if (v.idea) { const t = idea[v.idea]?.text || 'an idea'; return t.length > 48 ? t.slice(0, 46) + '…' : t; }
  if (v.node) return TREE[v.node]?.label || 'a group';
  if (v.lens !== null && v.lens !== undefined) return A.lenses[v.lens]?.label || 'a comparison';
  if (v.family !== null && v.family !== undefined) return A.families.find(f => f.id === v.family)?.name || 'a family';
  return (TABS.find(t => t[0] === v.tab) || ['', 'Start'])[1];
}
function hashOf(v){
  if (v.person && v.second) return `#compare=${v.person},${v.second}`;
  if (v.person) return `#person=${v.person}`;
  if (v.idea) return `#idea=${v.idea}`;
  if (v.node) return `#group=${v.node}`;
  if (v.lens !== null && v.lens !== undefined) return `#lens=${v.lens}`;
  if (v.family !== null && v.family !== undefined) return `#family=${v.family}`;
  return v.tab && v.tab !== 'start' ? `#${v.tab}` : '#';
}
function fromHash(h){
  const v = {tab:'start', person:null, second:null, idea:null, school:null, node:null, lens:null, family:null};
  const [k, val] = decodeURIComponent(h.replace(/^#/, '')).split('=');
  if (k === 'compare') { const [a, b] = val.split(','); if (person[a] && person[b]) Object.assign(v, {tab:'person', person:a, second:b}); }
  else if (k === 'person' && person[val]) Object.assign(v, {tab:'person', person:val});
  else if (k === 'idea' && idea[val]) Object.assign(v, {tab:'idea', idea:val});
  else if (k === 'group' && TREE[val]) Object.assign(v, {tab:'schools', node:val});
  else if (k === 'lens' && A.lenses[+val]) Object.assign(v, {tab:'lens', lens:+val});
  else if (k === 'family' && A.families.some(f => String(f.id) === val)) Object.assign(v, {tab:'family', family:A.families.find(f => String(f.id) === val).id});
  else if (TABS.some(t => t[0] === k)) v.tab = k;
  return v;
}
const nav = {depth:0, trail:[]};
function go(change){
  const before = snapshot();
  change();
  const after = snapshot();
  if (JSON.stringify(before) === JSON.stringify(after)) { render(); return; }
  nav.depth += 1;
  remember(after);
  history.pushState({view:after, depth:nav.depth, from:title(before)}, '', hashOf(after) === '#' ? location.pathname : hashOf(after));
  render(); fly();
}
function remember(v){
  if (v.tab === 'start' && !v.person && !v.idea && !v.node) return;
  const key = hashOf(v);
  nav.trail = [{key, view:v, label:title(v)}, ...nav.trail.filter(t => t.key !== key)].slice(0, 6);
}
function back(){ if (nav.depth > 0) history.back(); else go(() => { resetPicks(); state.tab = 'start'; }); }
addEventListener('popstate', e => {
  const v = e.state?.view || fromHash(location.hash);
  Object.assign(state, v); nav.depth = e.state?.depth || 0;
  render(); fly();
});
addEventListener('keydown', e => {
  if (e.key === 'Escape' && !e.target.matches('input, textarea')) { e.preventDefault(); if (card && !card.hidden) { hideCard(); return; } back(); }
});
function pickLens(i){ go(() => { resetPicks(); state.lens = i; state.tab = 'lens'; }); }
function pickFamily(i){ go(() => { resetPicks(); state.family = i; state.tab = 'family'; }); }
function pickPerson(id, fresh=false){
  go(() => {
    if (fresh) resetPicks();
    if (state.person && state.person!==id && !state.second && state.tab==='person'){ state.second = id; }
    else { state.person = id; state.second = null; }
    state.idea = state.school = state.node = state.lens = state.family = null; state.tab = 'person';
  });
}
function pickIdea(id){ go(() => { resetPicks(); state.idea = id; state.tab = 'idea'; }); }
function pickSchool(i){ go(() => { resetPicks(); state.school = i; state.tab='schools'; }); }
function pickNode(id){ go(() => { resetPicks(); state.node = id; state.tab='schools'; }); }
function clearPick(){ go(() => { const tab = state.tab; resetPicks(); state.tab = ['person'].includes(tab) ? 'people' : ['idea','family'].includes(tab) ? 'ideas' : tab === 'lens' ? 'schools' : tab; }); }
window.__atlas = {state, pickPerson, pickIdea, pickSchool, pickNode, pickLens, pickFamily, clearPick, back};

/* the camera follows the selection: a person or idea up close, a group from a little further */
const HOME = () => isMobile() ? [{x:0,y:440,z:560}, {x:0,y:90,z:0}] : [{x:0,y:400,z:560}, {x:0,y:40,z:0}];
function fly(){
  if (!G) return;
  const ctl = G.controls(); if (ctl && (state.person || state.idea || state.node)) ctl.autoRotate = false;
  const ms = REDUCE ? 0 : 900;
  let pts = [];
  if (state.person) pts = [state.person, state.second].filter(Boolean).map(id => nodeById[id]);
  else if (state.idea) pts = [nodeById[state.idea]];
  else if (state.node) pts = everyone(TREE[state.node]).map(id => nodeById[id]).filter(Boolean);
  pts = pts.filter(n => n && Number.isFinite(n.x));
  if (!pts.length) { const [pos, at] = HOME(); G.cameraPosition(pos, at, ms); return; }
  const c = {x: pts.reduce((t, n) => t + n.x, 0) / pts.length, y: pts.reduce((t, n) => t + n.y, 0) / pts.length, z: pts.reduce((t, n) => t + n.z, 0) / pts.length};
  const spread = Math.max(40, ...pts.map(n => Math.hypot(n.x - c.x, n.z - c.z)));
  const d = Math.min(520, 150 + spread * 2.2) * (isMobile() ? 1.35 : 1);
  G.cameraPosition({x: c.x, y: c.y + d * 0.55, z: c.z + d}, c, ms);
}

/* ---------- panel ---------- */
const TABS = [['start','Start'],['schools','Schools'],['people','People'],['ideas','Ideas'],['words','Words'],['method','How it was made']];
function dot(i){ return `<span class="layerdot ${i.inferred?'hollow':''}" style="background:${COLOR[i.layer]};border-color:${COLOR[i.layer]}"></span>`; }
function ideaRow(i, extra=''){ return `<button class="row" data-idea="${esc(i.id)}">${dot(i)}${esc(i.text)} ${extra}</button>`; }
function sortByDepth(list){ return [...list].sort((a,b) => LAYERS.indexOf(b.layer)-LAYERS.indexOf(a.layer)); }
function forkBars(f){
  const max = Math.max(1,...LAYERS.map(l => Math.max(...f.by_layer[l])));
  return `<div class="stack"><span></span><span>shared</span><span>opposed</span>` + LAYERS.map(l => {
    const [s,o] = f.by_layer[l];
    return `<span style="color:${COLOR[l]}">${NAME[l]}</span>
      <span><span class="bar" style="display:inline-block;width:${s/max*80}%;background:var(--accept)"></span> ${s}</span>
      <span><span class="bar" style="display:inline-block;width:${o/max*80}%;background:var(--reject)"></span> ${o}</span>`;
  }).join('') + `</div>`;
}
const views = {
  start(){
    return `<h2>${esc(A.copy.headline)}</h2>${A.copy.intro.map(p => `<p>${esc(p)}</p>`).join('')}

      <h3>How to read it</h3>
      <p>Height is depth. Assumptions about what exists sit at the bottom, and what should be done sits near the top. The faces float above, ringed in the colour of their camp and tied by hairlines to the people whose words sit closest to theirs. Select one and the ground they stand on lights up. Hollow wire spheres are inferred assumptions that nobody stated.</p>
      <p class="meta">Drag the space to turn it. Scroll to move in. Drag a face to pull it and its kin; let go and it settles back. Select a second person to compare.</p>`;
  },
  schools(){

      const held = A.ideas.map(i => ({i, n:i.holders.filter(h => s.members.includes(h.p) && h.a>0).length})).filter(x => x.n>1).sort((a,b) => b.n-a.n);

        <p class="meta">Held together in ${pct(s.cohesion)} of reruns.</p>${s.note?`<p>${esc(s.note)}</p>`:''}
        <div class="chips">${s.members.map(m => personChip(m)).join('')}</div>
        <h3>Ideas more than one member holds</h3>${held.slice(0,24).map(x => ideaRow(x.i,`<span class="meta">${x.n}</span>`)).join('')||'<p class="meta">None measured.</p>'}`;
    }
    const roots = A.tree?.length ? A.tree : null;
    if (!roots) return `<h2>Schools</h2>` + A.schools.map((s,i) => `<button class="row" data-school="${i}"><b style="color:${schoolColor(s)}">${esc(s.label||'Unaffiliated')}</b></button>`).join('');
    return `<h2>Camps</h2><p>Groups come from who takes which side, redrawn many times over resampled statements. Open a camp to see the schools inside it, then the closer circles inside those. The share is how often a group's members land together.</p>`

      + `<h3>Compare camps</h3>` + A.lenses.map((l,i) => `<button class="row" data-lens="${i}">${esc(l.label)}</button>`).join('');
  },
  group(){

    const parent = n.parent && TREE[n.parent];
    const siblings = parent ? parent.children.filter(c => c.id !== n.id) : (A.tree || []).filter(c => c.id !== n.id);
    return `${crumbs(n.id)}<h2 style="margin-top:8px;border-left:2px solid ${groupColor(n.id)};padding-left:10px">${esc(n.label)}</h2>

      ${siblings.length ? `<h3>${parent ? 'Alongside it in ' + esc(parent.label) : 'The other camps'}</h3>${siblings.map(c => groupRow(c)).join('')}` : ''}`;

      <p class="meta">${held.length} ideas · ${p.works.length} works read · <a href="/people#${encodeURIComponent(p.id)}">Full profile</a></p>

    if (!f) return `<h2>${esc(a.name)} and ${esc(b.name)}</h2><p>No shared ground measured.</p>`;
    const list = ids => sortByDepth(ids.map(x => idea[x]));
    return `<h2 style="margin-top:8px">${esc(a.name)} and ${esc(b.name)}</h2>
      <p class="meta">${f.lowest_opposed ? 'Deepest split: '+NAME[f.lowest_opposed] : (f.shared.length?'No opposed idea measured':'No shared ground measured')}${f.stable!=null?` · same school in ${pct(f.stable)} of reruns`:''}</p>
      ${forkBars(f)}
      <h3 class="tag-a">Stand on together</h3>${list(f.shared).map(i => ideaRow(i)).join('')||'<p class="meta">Nothing measured.</p>'}
      <h3 class="tag-r">Split on</h3>${list(f.opposed).map(i => ideaRow(i)).join('')||'<p class="meta">Nothing measured.</p>'}`;
  },
  idea(){
    if (!state.idea) return views.ideas();
    const i = idea[state.idea];
    const out = A.links.filter(l => l.s===i.id), inn = A.links.filter(l => l.t===i.id);
    const linkRow = (l,other,word) => `<button class="row" data-idea="${esc(other)}"><span class="meta" style="color:${LINK[l.type]}">${word}${l.source==='inferred'?' · inferred':''}</span><br>${esc(idea[other].text)}</button>`;
    const WORD = {supports:['supports','supported by'],rebuts:['rebuts','rebutted by'],undercuts:['undercuts','undercut by'],undermines:['undermines','undermined by'],qualifies:['qualifies','qualified by'],presupposes:['presupposes','presupposed by'],exemplifies:['exemplifies','exemplified by'],defines:['defines','defined by']};
    return `<button class="chip" data-clear>All ideas</button><h2 style="margin-top:8px">${esc(i.text)}</h2>
      <p class="meta"><span style="color:${COLOR[i.layer]}">${NAME[i.layer]}</span> · ${esc(i.kind)} · validity: ${esc(i.validity)} · first seen in this sample ${i.year||'unknown'}</p>
      <p class="meta">${i.holders.length} people · ${i.link_count} links · reasons per holder ${i.reasons.toFixed(2)}${i.carries?` · carries mostly ${i.carries}`:''}</p>
      ${i.inferred?`<p class="warn">Inferred assumption. No one stated this. A blind reader agreed these claims need it. People who hold it may reject it.</p>`:''}
      ${out.map(l => linkRow(l,l.t,WORD[l.type][0])).join('')}${inn.map(l => linkRow(l,l.s,WORD[l.type][1])).join('')}
      <h3>Who holds it</h3>${i.holders.map(h => `<div class="q">${personChip(h.p)} <span class="meta ${h.a>0?'tag-a':'tag-r'}">${h.a>0?'accepts':'rejects'}${h.inf?' · inferred':''}</span><br>${h.q?`“${esc(h.q)}” <a href="${esc(h.url)}" target="_blank" rel="noopener">${esc(h.work)}, ${h.year||''}</a>`:`<span class="meta">${esc(h.why||'')}</span>`}</div>`).join('')}`;
  },
  ideas(){
    const q = (state.q||'').toLowerCase();
    const hits = A.ideas.filter(i => !q || i.text.toLowerCase().includes(q)).sort((a,b)=>b.holders.length-a.holders.length).slice(0,60);
    return `<h2>Ideas</h2><h3>Families</h3><div class="chips" style="margin-bottom:10px">${A.families.filter(f => f.size>2).sort((a,b)=>b.size-a.size).map(f => `<button class="chip" data-family="${f.id}">${esc(f.name)}</button>`).join('')}</div><label for="search" class="meta">Search ${A.ideas.length} ideas and people</label><input id="search" type="search" value="${esc(state.q||'')}" autocomplete="off">
      <div id="hits"><div class="chips">${A.people.filter(p => q && p.name.toLowerCase().includes(q)).map(p => personChip(p.id)).join('')}</div>${hits.map(i => ideaRow(i,`<span class="meta">${i.holders.length}</span>`)).join('')}</div>`;
  },
  words(){
    return `<h2>One word, different worlds</h2><p>${esc(A.copy.words)}</p>` + A.senses.map(s => `<div class="finding"><b>${esc(s.term)}</b> <span class="meta">${s.fork?`gap ${s.distance.toFixed(3)}, p ${s.p.toFixed(3)}`:'no measurable difference'}</span>
      <div class="meta">${esc(s.a_label)}</div><div class="q">“${esc(s.a_example)}”</div><div class="meta">${esc(s.b_label)}</div><div class="q">“${esc(s.b_example)}”</div></div>`).join('')
      + `<h3>Reasons and belonging</h3><p>${esc(A.copy.belonging)}</p>${A.belonging.map(i => ideaRow(idea[i],`<span class="meta">${idea[i].holders.length} holders, ${idea[i].link_count} links</span>`)).join('')}`;
  },
  method(){
    return A.copy.method.map(s => `<h3>${esc(s.h)}</h3>${s.p.map(x => `<p>${esc(x)}</p>`).join('')}`).join('')
      + `<h3>Checks</h3>` + A.checks.map(c => `<p><b>${esc(c.name)}:</b> ${esc(c.result)}</p>`).join('')
      + `<h3>This map's own assumptions</h3><p>The map rests on these. They can be disputed like any other idea.</p>${A.copy.self.map(x => `<p>${esc(x)}</p>`).join('')}`;
  },
};
const pct = v => v==null ? 'n/a' : Math.round(v*100)+'%';
function groupRow(n){
  const names = everyone(n).map(id => person[id]?.name).filter(Boolean);
  const more = n.children?.length ? ` · ${n.children.length} group${n.children.length > 1 ? 's' : ''} inside` : '';
  return `<button class="row" data-node="${esc(n.id)}" style="border-left:2px solid ${groupColor(n.id)};padding-left:10px"><b>${esc(n.label)}</b> <span class="meta">${pct(n.cohesion)}${more}</span><br><span class="meta">${esc(names.slice(0, 8).join(', '))}${names.length > 8 ? ` and ${names.length - 8} more` : ''}</span></button>`;
}
function navBar(){
  const from = history.state?.from;
  const backBtn = nav.depth > 0 ? `<button class="back" data-back>← Back${from ? ` to ${esc(from)}` : ''}</button>` : '';
  const here = hashOf(snapshot());
  const trail = nav.trail.filter(t => t.key !== here).slice(0, 4);
  const trailHTML = trail.length ? `<div class="trail"><span class="meta">Recently viewed</span>${trail.map((t, i) => `<button class="chip" data-trail="${i}">${esc(t.label)}</button>`).join('')}</div>` : '';
  return backBtn || trailHTML ? `<nav class="navbar" aria-label="Where you've been">${backBtn}${trailHTML}</nav>` : '';
}
function crumbs(id){
  return `<nav class="crumbs" aria-label="Group path"><button class="crumb" data-tab="schools">All camps</button>${lineage(id).map(n => n.id === id
    ? `<span aria-current="page">${esc(n.label)}</span>`
    : `<button class="crumb" data-node="${esc(n.id)}">${esc(n.label)}</button>`).join('')}</nav>`;
}
function render(){
  const tab = state.tab;
  FOCUS = focusSet();
  document.getElementById('tabs').innerHTML = TABS.map(([k,v]) => `<button role="tab" aria-selected="${k===tab || (k==='people'&&tab==='person') || (k==='ideas'&&(tab==='idea'||tab==='family')) || (k==='schools'&&tab==='lens')}" data-tab="${k}">${v}</button>`).join('');
  document.getElementById('view').innerHTML = navBar() + views[tab]();
  document.title = state.tab === 'start' && !state.person ? 'Lifeworld Atlas · The Great AI Debate' : `${title(snapshot())} · Lifeworld Atlas · The Great AI Debate`;
  document.getElementById('ro-view').textContent = title(snapshot());
  document.getElementById('view').scrollTop = 0;
  if (G) refreshColors();
  const s = document.getElementById('search');
  if (s) s.addEventListener('input', e => { state.q = e.target.value; const pos = e.target.selectionStart; render(); const n = document.getElementById('search'); n.focus(); n.setSelectionRange(pos,pos); });
}
document.addEventListener('click', e => {
  const b = e.target.closest('button'); if (!b) return;
  const d = b.dataset;
  if ('back' in d) back();
  else if (d.trail !== undefined) { const t = nav.trail.filter(x => x.key !== hashOf(snapshot())).slice(0, 4)[+d.trail]; if (t) go(() => Object.assign(state, t.view)); }
  else if (d.tab){ go(() => { resetPicks(); state.tab = d.tab; }); }
  else if (d.person) pickPerson(d.person, true);
  else if (d.second) { go(() => { state.second = d.second; }); }
  else if (d.node) pickNode(d.node);
  else if (d.idea) pickIdea(d.idea);
  else if (d.school!==undefined) pickSchool(+d.school);
  else if (d.lens!==undefined) pickLens(+d.lens);
  else if (d.family!==undefined) pickFamily(+d.family);
  else if ('clear' in d) { clearPick(); }
});

/* ---------- controls ---------- */
document.getElementById('sub').textContent = `${A.people.length} people · ${A.ideas.length} ideas · ${A.links.length} links · provisional, no person has ratified this`;
document.getElementById('layers').innerHTML = LAYERS.map(l => `<label><input type="checkbox" checked data-layer="${l}"><span class="layerdot" style="background:${COLOR[l]};margin:0"></span>${NAME[l]}</label>`).join('');
document.getElementById('camps').innerHTML = (A.tree || []).map((n, i) => `<div class="key"><span class="face" style="--sw:${CAMP[i % CAMP.length]}"></span>${esc(n.label)}</div>`).join('') + `<div class="key"><span class="face" style="--sw:${UNGROUPED}"></span>Between camps</div>`;
document.getElementById('layers').addEventListener('change', e => { const l = e.target.dataset.layer; e.target.checked ? state.hidden.delete(l) : state.hidden.add(l); if (G) refreshColors(); });
if (isMobile()) document.getElementById('legend').open = false;
const yr = document.getElementById('year');
yr.min = A.meta.first_year; yr.max = A.meta.last_year; yr.value = A.meta.last_year;
const setYear = () => { state.year = +yr.value; document.getElementById('yearv').textContent = yr.value; if (G) refreshColors(); };
yr.addEventListener('input', setYear); setYear();

if (location.hash === '#text' || !hasWebGL() || !window.ForceGraph3D || !window.THREE){
  document.body.classList.add('nogl');
  document.getElementById('controls').hidden = true;
  document.getElementById('time').hidden = true;
  document.getElementById('sub').textContent += ' · 3D is unavailable here, so this is the text version';
} else start3D();
// open on the view named in the link, if any, and make it the first step of this page's history
Object.assign(state, fromHash(location.hash === '#text' ? '' : location.hash));
history.replaceState({view:snapshot(), depth:0}, '', location.href);
remember(snapshot());
render();
if (G && (state.person || state.idea || state.node)) setTimeout(fly, REDUCE ? 50 : 600);
</script>
