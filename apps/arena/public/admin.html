<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Room moderation</title>
<meta name="robots" content="noindex">
<link rel="stylesheet" href="style.css">
</head>
<body>
<main>
  <h1>Room moderation</h1>
  <p class="muted">Approve or reject participant statements, and read placement reports. The token is kept for this browser tab only.</p>
  <form id="login" class="row">
    <input type="text" id="room" value="ai-futures" aria-label="Room" style="max-width:200px">
    <input type="password" id="token" placeholder="Admin token" aria-label="Admin token" style="max-width:280px">
    <button class="primary" type="submit">Load</button>
  </form>
  <p id="msg" role="status" class="small"></p>
  <section id="out"></section>
</main>
<script type="module" src="/admin.js"></script>
</body>
</html>
