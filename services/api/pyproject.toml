[project]
name = "arena_api"
version = "0.0.0"
description = "FastAPI read and write endpoints."
requires-python = ">=3.12,<3.13"
dependencies = ["fastapi>=0.115", "uvicorn>=0.30", "sqlalchemy>=2", "psycopg[binary]>=3.2", "arena_core", "arena_fingerprint", "arena_rounds"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/arena_api"]

[tool.uv.sources]
arena_core = { workspace = true }
arena_fingerprint = { workspace = true }
arena_rounds = { workspace = true }
