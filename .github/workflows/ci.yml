name: CI
on:
  push:
    branches: [main]
  pull_request:

jobs:
  ci:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      postgres:
        image: pgvector/pgvector@sha256:a132765ec351c65111b5b675928a3a0515a466a40f97277329db8b8209ad8bc9
        env:
          POSTGRES_USER: arena
          POSTGRES_PASSWORD: arena-ci-only
          POSTGRES_DB: arena
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U arena -d arena"
          --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      ARENA_DATABASE_URL: postgresql+psycopg://arena:arena-ci-only@localhost:5432/arena
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.8.0"
      - run: uv sync --all-packages --frozen
      - run: make ci
      - name: Gate checks on a real database (G0.2, G0.3)
        run: |
          make migrate
          uv run alembic -c packages/arena_core/alembic.ini downgrade base
          make migrate
          make seed
